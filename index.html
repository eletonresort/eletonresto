  if (mq) {
    var alSistema = function () { if (!guardado()) { tema = sistema(); aplicarTema(); } };
    if (mq.addEventListener) { mq.addEventListener('change', alSistema); } else if (mq.addListener) { mq.addListener(alSistema); }
  }

  /* ===== IDIOMA ===== */
  function armarServicios() {
    var t = T[lang], sel = $('erc-serv'), v = sel.value;
    var h = '<option value="">' + esc(t.res_sel_servicio) + '</option>';
    SERV.forEach(function (k, i) { h += '<option value="' + k + '">' + esc(t.servicios[i]) + '</option>'; });
    sel.innerHTML = h;
    sel.value = v;
  }
  function armarHorarios() {
    var t = T[lang], s = $('erc-serv').value, sel = $('erc-hora'), v = sel.value, h;
    if (!s) { sel.innerHTML = '<option value="">' + esc(t.horarios_label) + '</option>'; return; }
    h = '<option value="">' + esc(t.elegir_horario) + '</option>';
    HORARIOS[s].forEach(function (x) { h += '<option value="' + x + '">' + x + '</option>'; });
    sel.innerHTML = h;
    if (v && HORARIOS[s].indexOf(v) > -1) { sel.value = v; } else { sel.selectedIndex = 0; }
  }
  function setLang(l) {
    if (!T[l]) { l = 'es'; }
    lang = l;
    var t = T[l];
    document.documentElement.setAttribute('lang', l);
    each(root.querySelectorAll('[data-lang]'), function (b) {
      var on = b.getAttribute('data-lang') === l;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    each(root.querySelectorAll('[data-k]'), function (el) { var k = el.getAttribute('data-k'); if (t[k] !== undefined) { el.textContent = t[k]; } });
    each(root.querySelectorAll('.erc-lang'), function (el) { el.setAttribute('aria-label', t.idioma); });
    $('erc-nom').placeholder = t.ph_nombre;
    $('erc-tel').placeholder = t.ph_tel;
    $('erc-err').style.display = 'none';
    armarServicios();
    armarHorarios();
    aplicarTema();
  }

  /* ===== GALERIA ===== */
  var gal = $('erc-gal'), dots = $('erc-dots'), vivas = [], cur = 0, timer = null, sig = 0;
  function mostrar(n) {
    if (!vivas.length) { return; }
    cur = (n + vivas.length) % vivas.length;
    vivas.forEach(function (s, i) { s.classList.toggle('on', i === cur); });
    each(dots.children, function (d, i) { d.classList.toggle('on', i === cur); });
  }
  function parar() { if (timer) { clearInterval(timer); timer = null; } }
  function iniciarAuto() {
    parar();
    if (reduce || vivas.length < 2 || document.hidden) { return; }
    timer = setInterval(function () { mostrar(cur + 1); }, 4500);
  }
  function armarPuntos() {
    var h = '';
    vivas.forEach(function (s, i) { h += '<button type="button" class="erc-dot' + (i === cur ? ' on' : '') + '" data-slide="' + i + '" aria-label="Foto ' + (i + 1) + '"></button>'; });
    dots.innerHTML = vivas.length > 1 ? h : '';
  }
  function cargarSiguiente() {
    if (sig >= CFG.fotos.length) {
      if (!vivas.length) { gal.classList.add('erc-nofoto'); }
      return;
    }
    var f = CFG.fotos[sig], img = new Image(), primera = (sig === 0);
    sig++;
    img.className = 'erc-sl';
    img.alt = 'Eleton Restó & Grill';
    img.decoding = 'async';
    img.style.objectPosition = f[1] || 'center';
    if (primera) { img.setAttribute('fetchpriority', 'high'); }
    img.onload = function () {
      gal.insertBefore(img, gal.firstChild);
      vivas.push(img);
      armarPuntos();
      if (vivas.length === 1) { mostrar(0); iniciarAuto(); } else if (vivas.length === 2) { iniciarAuto(); }
      cargarSiguiente();
    };
    img.onerror = function () { cargarSiguiente(); };
    img.src = CFG.fotosBase + f[0];
  }

  /* ===== RESERVAS ===== */
  function enviar() {
    var t = T[lang];
    var campos = [$('erc-fecha'), $('erc-serv'), $('erc-hora'), $('erc-pers'), $('erc-nom'), $('erc-tel')];
    var err = $('erc-err'), i, falta = null;
    for (i = 0; i < campos.length; i++) { if (!String(campos[i].value).trim()) { falta = campos[i]; break; } }
    if (falta) {
      err.textContent = t.res_error;
      err.style.display = 'block';
      try { falta.focus(); } catch (e) { }
      return;
    }
    err.style.display = 'none';
    var d = campos[0].value.split('-');
    var m = MESES[lang][parseInt(d[1], 10) - 1], dia = parseInt(d[2], 10);
    var fechaTxt = lang === 'en' ? m + ' ' + dia + ', ' + d[0] : dia + ' de ' + m + ' de ' + d[0];
    var msg = t.wa;
    msg = msg.split('{fecha}').join(fechaTxt);
    msg = msg.split('{servicio}').join(t.servicios[SERV.indexOf(campos[1].value)]);
    msg = msg.split('{horario}').join(campos[2].value);
    msg = msg.split('{personas}').join(campos[3].value);
    msg = msg.split('{nombre}').join(campos[4].value.trim());
    msg = msg.split('{tel}').join(campos[5].value.trim());
    window.open('https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  }

  function clarity() {
    if (!CFG.clarity || window.clarity) { return; }
    (function (c, l, a, r, i, t, y) {
      c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
      t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
      y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
    })(window, document, 'clarity', 'script', CFG.clarity);
  }

  /* ===== ARRANQUE ===== */
  function arrancar() {
    $('erc-flogo').src = $('erc-logo').src;
    $('erc-ver').href = CFG.carta;
    var f = $('erc-fecha'), hoy = hoyLocal();
    f.min = hoy;
    f.value = hoy;
    document.addEventListener('click', function (e) {
      var el = e.target, b;
      if (!el || !el.closest) { return; }
      b = el.closest('[data-lang]');
      if (b) { setLang(b.getAttribute('data-lang')); return; }
      b = el.closest('[data-tema-btn]');
      if (b) {
        tema = tema === 'noche' ? 'dia' : 'noche';
        root.classList.add('erc-tt');
        try { window.localStorage.setItem(CLAVE, tema); } catch (x) { }
        aplicarTema();
        return;
      }
      b = el.closest('[data-slide]');
      if (b) { mostrar(parseInt(b.getAttribute('data-slide'), 10)); iniciarAuto(); }
    });
    document.addEventListener('visibilitychange', function () { if (document.hidden) { parar(); } else { iniciarAuto(); } });
    $('erc-serv').addEventListener('change', armarHorarios);
    $('erc-send').addEventListener('click', enviar);
    var sx = 0, sy = 0;
    gal.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    gal.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { mostrar(cur + (dx < 0 ? 1 : -1)); iniciarAuto(); }
    }, { passive: true });
    setLang('es');
    cargarSiguiente();
    clarity();
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', arrancar); } else { arrancar(); }
})();

</script>
</body>
</html>
